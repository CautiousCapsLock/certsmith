name: release

# Push a tag such as v0.11.0 to publish a release:
#   git tag v0.11.0 && git push origin v0.11.0
# Tags with a suffix (v0.12.0-rc1) are published as pre-releases.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Only this job writes: it publishes the release and the build provenance attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build and package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          mkdir -p out
          for arch in amd64 arm64; do
            pkg="certsmith-${version}-linux-${arch}"
            mkdir -p "stage/${pkg}"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "stage/${pkg}/certsmith-linux-${arch}" ./cmd/certsmith
            cp deploy/install.sh deploy/certsmith.service "stage/${pkg}/"
            cp internal/web/static/THIRD_PARTY_NOTICES.txt "stage/${pkg}/"
            tar -C stage -czf "out/${pkg}.tar.gz" "${pkg}"
          done
          (cd out && sha256sum ./*.tar.gz > SHA256SUMS)
          cat out/SHA256SUMS

      # Integrity: SHA256SUMS over HTTPS from the repository itself, and a signed build provenance
      # attestation for each archive, which proves it was built from this repository by this workflow:
      #   gh attestation verify certsmith-X.Y.Z-linux-amd64.tar.gz --repo CautiousCapsLock/certsmith
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.tar.gz

      # The notes are docs/releases/<tag>.md when that file exists, and generated from the commits otherwise.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          if [ -f "docs/releases/${TAG}.md" ]; then
            notes="--notes-file docs/releases/${TAG}.md"
          else
            notes="--generate-notes"
          fi
          gh release create "$TAG" out/* --title "CertSmith ${TAG#v}" $notes $flags
