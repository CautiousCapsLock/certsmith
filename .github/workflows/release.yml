name: release

# Push a tag such as v0.11.0 to publish a release:
#   git tag v0.11.0 && git push origin v0.11.0
# Tags with a suffix (v0.12.0-rc1) are published as pre-releases.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build and package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          mkdir -p out
          for arch in amd64 arm64; do
            pkg="certsmith-${version}-linux-${arch}"
            mkdir -p "stage/${pkg}"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "stage/${pkg}/certsmith-linux-${arch}" ./cmd/certsmith
            cp deploy/install.sh deploy/certsmith.service "stage/${pkg}/"
            cp internal/web/static/THIRD_PARTY_NOTICES.txt "stage/${pkg}/"
            tar -C stage -czf "out/${pkg}.tar.gz" "${pkg}"
          done
          (cd out && sha256sum ./*.tar.gz > SHA256SUMS)
          cat out/SHA256SUMS

      # Integrity today is SHA256SUMS over HTTPS from the repository itself.
      # Detached signatures arrive before the in-app updater does (docs/APPLIANCE.md, step 5).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" out/* --title "CertSmith ${TAG#v}" --generate-notes $flags
