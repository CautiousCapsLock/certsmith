<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CertSmith</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<header class="top">
  <div class="brand"><img class="logo" src="favicon.svg" alt="" width="26" height="26">CertSmith</div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <button id="readme-btn" class="btn ghost" title="Open the instructions for using CertSmith in their own window">Readme</button>
  <button id="logout-btn" class="btn ghost">Sign out</button>
</header>
<main id="view" aria-live="polite"><p class="sub">Loading…</p></main>
<footer id="appfoot" class="appfoot"></footer>
<div id="modal-root"></div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
